name: eco_sus_rural
description: "EcoSusRural - Ecology, Sustainability & Rural Empowerment. A cross-platform rural commerce and empowerment ecosystem."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.0
  shared_preferences: ^2.3.2
  cryptography: ^2.9.0

dependency_overrides:
  riverpod: 2.6.1
  stack_trace: 1.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/lang/manifest.json
